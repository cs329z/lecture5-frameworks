[project]
name = "lecture5-frameworks"
version = "0.1.0"
description = "CS329Z Lecture 5: experimenting with DSPy, LangGraph, and Temporal"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dspy[deno]>=3.4.0",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langchain-anthropic>=1.7.5",
    "temporalio>=1.34.0",
    "python-dotenv>=1.2.4",
    "langgraph>=1.2",
    "numpy>=2.5.3",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyter>=1.1",
]
